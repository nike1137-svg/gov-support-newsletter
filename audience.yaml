# 타깃 독자 · 중요도 기준 · 제외 조건
# graph.py 와 tools/probe_sources.py 가 이 파일 하나를 읽는다. 기준을 코드에 따로 적지 않는다.

reader:
  # 누구에게 보내는가 — 선별·요약 프롬프트의 첫 줄이 된다
  persona: 혼자 사업을 준비하거나 막 시작한 1인 창조기업 운영자
  # 이 독자가 원하는 정보의 종류 — 소스 범위를 공고만이 아니라 여기까지 넓힌 근거 (docs/source-criteria.md v2)
  needs:
    - 지금 신청할 수 있는 지원사업 공고
    - 창업자에게 영향을 주는 정책 변화
    - 초기 창업 기업의 소식과 투자 흐름

# 독자 적합 키워드 — 소스 채택 기준 C4 (최신 10건 제목 중 비율 50% 이상)
# 측정 전에 확정한 목록이다. 결과를 보고 늘리지 않는다 (中企 누락 한계는 source-criteria.md 에 기록)
reader_keywords: [창업, 스타트업, 소상공인, 중소기업, 1인, 지원, 정책, 공고, 모집, 세금, 투자]

# 중요도 기준 — 2단계(선별). 위에 있을수록 우선한다
# LLM 은 기사마다 이 id 중 하나를 라벨로 붙여야 하고, 붙인 이유를 한 문장으로 남긴다
importance:
  - id: 기준1
    text: 지금 신청할 수 있고 1인·예비창업자도 대상인 지원사업
  - id: 기준2
    text: 1인 창조기업 운영에 직접 영향을 주는 정책 변화 (세금 · 자금 · 규제)
  - id: 기준3
    text: 초기 창업 기업의 실행 사례와 투자 흐름

# 버릴 것 — how 가 code 인 규칙은 LLM 을 부르기 전에 코드가 먼저 거른다 (근거가 필드에 있어서)
drop:
  - id: 버림1
    text: 신청 마감이 지난 공고
    how: code      # 기업마당 신청기간 끝 날짜가 오늘보다 앞이면
  - id: 버림2
    text: 대기업 · 중견기업만 대상이고 중소기업 · 소상공인 · 창업자가 빠진 공고
    how: code+llm  # 지원대상 필드에 중견·대기업만 있으면 코드가, 필드가 없는 기사는 LLM 이 본다
  - id: 버림3
    text: 행사 사진 · 인사 동정 · 수상 소식처럼 독자가 행동할 거리가 없는 것
    how: llm
  - id: 버림4
    text: 위 세 기준 어디에도 해당하지 않는 것
    how: llm

# 판정 주의 — 2026-09-15 첫 실행에서 LLM 이 '지원대상: 중소기업' 9건을 버림2 로 잘못 버렸다.
# 1인 창조기업은 규모상 중소기업 · 소상공인에 들어가므로, 지원대상이 그렇게 적힌 공고는 독자도 대상으로 본다.
notes:
  - 지원대상이 중소기업 · 소상공인 · 창업기업 · 예비창업자이면 1인 창조기업도 신청 대상으로 본다. 이런 공고는 버림2 가 아니다
  - 목록에 지원대상이 적혀 있지 않은 기사에 지원대상을 근거로 들지 않는다

exclude:
  # 과제가 제외하라고 한 소스. 수집·측정 전에 주소를 검사해 걸리면 멈춘다
  source_hosts:
    - openai.com
    - deepmind.google
    - techcrunch.com
    - theverge.com
    - technologyreview.com
    - aitimes.com
